name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PROJECT_NAME: splendide

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure PostHog
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY || secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/environments/environment.prod.ts';
          const posthogKey = process.env.POSTHOG_KEY || '';
          const posthogHost = process.env.POSTHOG_HOST || 'https://eu.i.posthog.com';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/posthogKey:\s*['"][^'"]*['"]/, `posthogKey: ${JSON.stringify(posthogKey)}`);
          source = source.replace(/posthogHost:\s*['"][^'"]*['"]/, `posthogHost: ${JSON.stringify(posthogHost)}`);
          fs.writeFileSync(path, source);
          NODE

      - name: Build Angular
        run: npm run build -- --configuration production --base-href "/"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/${{ env.PROJECT_NAME }}/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
